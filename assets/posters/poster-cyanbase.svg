<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="cb-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e4dc"/>
      <stop offset="100%" style="stop-color:#d4cfc4"/>
    </linearGradient>
    <linearGradient id="cb-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#0d1218"/>
    </linearGradient>
    <pattern id="cb-rain" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="3" y1="0" x2="3" y2="6" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#cb-top)"/>
  <rect y="300" width="400" height="300" fill="url(#cb-bottom)"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#3d6d6d" stroke-width="2"/>
  <!-- Woodblock clouds -->
  <path d="M0 40 Q60 80 120 50 T240 45 T400 30 L400 0 L0 0 Z" fill="#3d6d6d" opacity="0.35"/>
  <path d="M400 50 Q320 90 260 60 T160 55 T0 35 L0 0 L400 0 Z" fill="#2a5555" opacity="0.25" transform="translate(0,0)"/>
  <!-- Gate / screen frame -->
  <rect x="120" y="70" width="160" height="180" fill="none" stroke="#1a2332" stroke-width="3"/>
  <rect x="130" y="85" width="140" height="140" fill="#1a2332" opacity="0.08"/>
  <rect x="138" y="95" width="124" height="50" fill="#3d6d6d" opacity="0.4"/>
  <rect x="138" y="152" width="124" height="60" fill="#2a4545" opacity="0.35"/>
  <!-- Film perforations -->
  <g fill="#1a2332" opacity="0.5">
    <rect x="125" y="88" width="4" height="8"/><rect x="125" y="120" width="4" height="8"/><rect x="125" y="152" width="4" height="8"/>
    <rect x="271" y="88" width="4" height="8"/><rect x="271" y="120" width="4" height="8"/><rect x="271" y="152" width="4" height="8"/>
  </g>
  <rect width="400" height="300" fill="url(#cb-rain)" opacity="0.6"/>
  <!-- Title block -->
  <text x="200" y="38" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1a2332" letter-spacing="0.35em">映像索引</text>
  <text x="200" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1a2332" letter-spacing="0.15em">CYANBASE</text>
  <!-- Reflection: carousel / horizon -->
  <g opacity="0.45">
    <ellipse cx="200" cy="420" rx="140" ry="25" fill="none" stroke="#5a8a8a" stroke-width="1"/>
    <ellipse cx="200" cy="445" rx="110" ry="18" fill="none" stroke="#4a7a7a" stroke-width="0.8"/>
    <path d="M80 380 Q200 360 320 380" fill="none" stroke="#6a9a9a" stroke-width="0.75" opacity="0.6"/>
  </g>
  <text x="200" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8a9aaa" letter-spacing="0.4em">THE MOVIE DATABASE · WEB</text>
  <text x="200" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6a7a8a">A film by Sai Tanuj Karavadi</text>
</svg>
