<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="rg-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ece8e0"/>
      <stop offset="100%" style="stop-color:#ddd8cc"/>
    </linearGradient>
    <linearGradient id="rg-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#121a24"/>
      <stop offset="100%" style="stop-color:#070a0e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#rg-top)"/>
  <rect y="300" width="400" height="300" fill="url(#rg-bottom)"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#3d6d6d" stroke-width="2"/>
  <!-- RETRIEVAL prominent on light half -->
  <text x="200" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1a2332" letter-spacing="0.55em">RETRIEVAL</text>
  <text x="200" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3d4d5d" letter-spacing="0.4em">AUGMENTED</text>
  <!-- Document stack upper -->
  <g stroke="#1a2332" fill="none" stroke-width="1.2">
    <rect x="130" y="145" width="140" height="88" fill="#f2ede6" opacity="0.65"/>
    <line x1="145" y1="165" x2="255" y2="165"/>
    <line x1="145" y1="182" x2="240" y2="182"/>
    <line x1="145" y1="199" x2="250" y2="199"/>
  </g>
  <text x="200" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1a2332" letter-spacing="0.2em">RAG</text>
  <g stroke="#5a9aaa" fill="#4a8a9a" opacity="0.85">
    <circle cx="120" cy="55" r="5"/>
    <circle cx="200" cy="42" r="5"/>
    <circle cx="280" cy="58" r="5"/>
    <line x1="120" y1="55" x2="200" y2="42" stroke-width="0.9"/>
    <line x1="200" y1="42" x2="280" y2="58" stroke-width="0.9"/>
    <line x1="200" y1="42" x2="200" y2="145" stroke-width="0.9"/>
  </g>
  <!-- Graph reflection: lighter strokes for dark area -->
  <g opacity="0.55" stroke="#8ab0c0" fill="none" stroke-width="0.9">
    <circle cx="130" cy="400" r="6"/><circle cx="200" cy="385" r="6"/><circle cx="270" cy="402" r="6"/>
    <circle cx="165" cy="440" r="5"/><circle cx="235" cy="438" r="5"/>
    <line x1="130" y1="400" x2="200" y2="385"/><line x1="200" y1="385" x2="270" y2="402"/>
    <line x1="130" y1="400" x2="165" y2="440"/><line x1="270" y1="402" x2="235" y2="438"/>
    <line x1="165" y1="440" x2="235" y2="438"/>
  </g>
  <text x="200" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9aacbc" letter-spacing="0.35em">OPENSEARCH · LAMBDA · PYLLAMA</text>
  <text x="200" y="565" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#7a8a9a">What the documents remember</text>
</svg>
